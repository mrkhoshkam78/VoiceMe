<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ویرایشگر صوتی تحت وب – Audio Editor V1.01">
  <title>ویرایشگر صوتی | Audio Editor V1.01</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="logo">
      <div class="logo-icon">🎵</div>
      <h1>ویرایشگر صوتی</h1>
      <span class="version">V1.01</span>
    </div>
  </header>

  <main class="main">
    <!-- Upload -->
    <section class="upload-section" id="uploadSection">
      <div class="upload-icon">📁</div>
      <h2>فایل صوتی را آپلود کنید</h2>
      <p>پشتیبانی از MP3، WAV، OGG، M4A — یا فایل را اینجا رها کنید</p>
      <button type="button" class="btn btn-primary" onclick="document.getElementById('fileInput').click()">
        انتخاب فایل
      </button>
      <input type="file" id="fileInput" accept="audio/*,.mp3,.wav,.ogg,.m4a,.aac,.flac,.webm">

      <div class="file-info" id="fileInfo">
        <div class="file-info-grid">
          <div class="file-meta">
            <span class="label">نام فایل</span>
            <span class="value" id="fileName">—</span>
          </div>
          <div class="file-meta">
            <span class="label">حجم</span>
            <span class="value" id="fileSize">—</span>
          </div>
          <div class="file-meta">
            <span class="label">مدت زمان</span>
            <span class="value" id="fileDuration">—</span>
          </div>
          <div class="file-meta">
            <span class="label">فرمت</span>
            <span class="value" id="fileFormat">—</span>
          </div>
        </div>
        <div class="file-actions">
          <button type="button" class="btn btn-secondary btn-sm" id="btnChangeFile">تغییر فایل</button>
          <button type="button" class="btn btn-danger btn-sm" id="btnRemoveFile">حذف</button>
        </div>
      </div>
    </section>

    <!-- Player -->
    <section class="player-section" id="playerSection">
      <div class="player-header">
        <h3>پیش‌نمایش</h3>
        <div class="player-mode">
          <button type="button" class="mode-btn" id="modeOriginal">اصلی</button>
          <button type="button" class="mode-btn active" id="modeProcessed">پردازش‌شده</button>
        </div>
      </div>
      <div class="waveform-container">
        <canvas id="waveformCanvas"></canvas>
      </div>
      <div class="player-controls">
        <button type="button" class="play-btn" id="playBtn" aria-label="پخش / توقف">▶</button>
        <div class="timeline">
          <div class="time-display">
            <span id="currentTime">00:00</span>
            <span id="totalTime">00:00</span>
          </div>
          <input type="range" class="seek-bar" id="seekBar" min="0" max="100" value="0" step="0.01">
        </div>
        <div class="volume-control" title="حجم پخش‌کننده مرورگر را از سیستم کنترل کنید">
          <span>🔊</span>
        </div>
      </div>
    </section>

    <!-- Effects -->
    <section class="effects-section" id="effectsSection">
      <h2 class="section-title">🎛️ پنل افکت‌ها</h2>
      <div class="effects-grid" id="effectsGrid">
        <!-- Cards injected by JS -->
      </div>
    </section>

    <!-- Processing Chain -->
    <section class="chain-section" id="chainSection">
      <h2 class="section-title">🔗 زنجیره پردازش فعال</h2>
      <div class="chain-list" id="chainList">
        <span class="chain-empty">هیچ افکتی فعال نیست — صدای اصلی پخش می‌شود</span>
      </div>
    </section>

    <!-- Actions -->
    <div class="actions-bar" id="actionsBar">
      <button type="button" class="btn btn-secondary" id="btnReset">بازنشانی همه افکت‌ها</button>
      <button type="button" class="btn btn-success" id="btnExport">⬇️ خروجی WAV</button>
    </div>
  </main>

  <!-- Progress Overlay -->
  <div class="progress-overlay" id="progressOverlay">
    <div class="progress-spinner"></div>
    <div class="progress-text" id="progressText">در حال پردازش...</div>
    <div class="progress-bar-container">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </div>

  <!-- Toasts -->
  <div class="toast-container" id="toastContainer"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
