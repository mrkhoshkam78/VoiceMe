<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ویرایشگر صوتی حرفه‌ای – Audio Editor V1.03">
  <title>ویرایشگر صوتی | Audio Editor V1.03</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="logo">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
      </div>
      <h1>ویرایشگر صوتی</h1>
      <span class="version-badge">V1.03</span>
    </div>
    <div class="header-actions">
      <button type="button" class="theme-btn" id="themeBtn" aria-label="تغییر تم" title="تغییر تم">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      </button>
    </div>
  </header>

  <main class="main">
    <!-- Upload -->
    <section class="upload-zone" id="uploadZone">
      <div class="upload-empty">
        <div class="upload-icon-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        </div>
        <h2>فایل صوتی را آپلود کنید</h2>
        <p>MP3 · WAV · OGG · M4A — یا فایل را اینجا رها کنید</p>
        <button type="button" class="btn btn-primary" id="btnPickFile">انتخاب فایل</button>
      </div>
      <div class="file-card" id="fileCard">
        <div class="file-card-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
        </div>
        <div class="file-card-info">
          <div class="file-card-name" id="fileName">—</div>
          <div class="file-card-meta">
            <span id="fileSize">—</span>
            <span id="fileDuration">—</span>
            <span id="fileFormat">—</span>
          </div>
        </div>
        <div class="file-card-actions">
          <button type="button" class="btn btn-ghost btn-sm" id="btnChangeFile">تغییر</button>
          <button type="button" class="btn btn-danger-ghost btn-sm" id="btnRemoveFile">حذف</button>
        </div>
      </div>
      <input type="file" id="fileInput" accept="audio/*,.mp3,.wav,.ogg,.m4a,.aac,.flac,.webm,.opus">
    </section>

    <!-- Player -->
    <section class="player-panel" id="playerPanel">
      <div class="player-top">
        <h3>پیش‌نمایش</h3>
        <div class="mode-switch">
          <button type="button" id="modeOriginal">اصلی</button>
          <button type="button" class="active" id="modeProcessed">پردازش‌شده</button>
        </div>
      </div>
      <div class="viz-area">
        <canvas id="vizCanvas"></canvas>
      </div>
      <div class="player-controls">
        <button type="button" class="play-btn" id="playBtn" aria-label="پخش">
          <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <div class="timeline-wrap">
          <div class="time-row">
            <span id="currentTime">00:00</span>
            <span id="totalTime">00:00</span>
          </div>
          <input type="range" class="seek-track" id="seekBar" min="0" max="100" value="0" step="0.01" aria-label="موقعیت پخش">
        </div>
      </div>
    </section>

    <!-- Effects Workspace -->
    <div class="effects-workspace" id="effectsWorkspace">
      <aside class="effects-sidebar" id="effectsSidebar">
        <div class="sidebar-title">افکت‌ها</div>
        <!-- injected -->
      </aside>
      <div class="controls-panel" id="controlsPanel">
        <div class="controls-empty" id="controlsEmpty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          <span>یک افکت را انتخاب کنید</span>
        </div>
        <div id="controlsContent" style="display:none"></div>
      </div>
    </div>

    <!-- Chain -->
    <section class="chain-bar" id="chainBar">
      <h3>زنجیره پردازش</h3>
      <div class="chain-flow" id="chainFlow">
        <span class="chain-empty-msg">هیچ افکتی فعال نیست</span>
      </div>
    </section>
  </main>

  <!-- Action Bar -->
  <div class="action-bar" id="actionBar">
    <div class="action-bar-inner">
      <button type="button" class="btn btn-ghost" id="btnReset">بازنشانی</button>
      <button type="button" class="btn btn-success" id="btnExport">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        خروجی WAV
      </button>
    </div>
  </div>

  <!-- Overlay -->
  <div class="overlay" id="overlay">
    <div class="spinner"></div>
    <div class="overlay-text" id="overlayText">در حال پردازش...</div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <div class="toast-box" id="toastBox"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
